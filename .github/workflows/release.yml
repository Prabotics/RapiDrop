name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: 'v1.0.0'
permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Artifacts
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Select Xcode 16
        run: |
          for xcode in /Applications/Xcode_16*.app; do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Run Unit Tests
        run: swift test --package-path macos

      - name: Package macOS App Bundle & DMG
        run: |
          chmod +x macos/package.sh
          cd macos && ./package.sh --all

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: |
            macos/RapiDrop-macOS.dmg
            macos/RapiDrop-macOS.zip

  build-android:
    name: Build Android Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        working-directory: android
        run: ./gradlew test

      - name: Decode Release Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/rapidrop-release.jks

      - name: Assemble Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: /home/runner/.android/rapidrop-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Clean Up Keystore
        if: always()
        run: rm -f ~/.android/rapidrop-release.jks
      - name: Prepare APK Artifact
        run: |
          mkdir -p android-release
          cp android/app/build/outputs/apk/release/app-release.apk android-release/RapiDrop.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: android-release/RapiDrop.apk

  publish-release:
    name: Create GitHub Release
    needs: [build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract Changelog Section
        id: changelog
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -f CHANGELOG.md ]; then
            awk "/^## \\[$VERSION\\]/{flag=1;next}/^## \\[/ {if(flag) {flag=0; exit}} flag" CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            awk '/^## \[/{flag++; if(flag==1){next} if(flag==2){exit}} flag' CHANGELOG.md > release-notes.md || true
          fi
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: false
