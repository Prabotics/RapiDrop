version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/windows"
    schedule:
      interval: "weekly"
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "swift"
    directory: "/macos"
    schedule:
      interval: "weekly"
    groups:
      swift-dependencies:
        patterns:
          - "*"
